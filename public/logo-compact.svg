<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" fill="none">
  <defs>
    <linearGradient id="logo-grad-compact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow-compact" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Symbol Mark (32x32 at x=2, y=2) -->
  <g transform="translate(2, 2)">
    <!-- Base Squircle -->
    <rect width="32" height="32" rx="8" fill="url(#logo-grad-compact)" />
    <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8" />

    <!-- Upper Arc Arrow (Left -> Right) -->
    <path d="M 16 8 C 21.5 8 24 10.5 24 14" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 22 12.5 L 24 14.5 L 26 12.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Lower Arc Arrow (Right -> Left) -->
    <path d="M 16 24 C 10.5 24 8 21.5 8 18" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 10 19.5 L 8 17.5 L 6 19.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Top-Left Seat Card -->
    <g filter="url(#shadow-compact)">
      <rect x="6.5" y="7" width="9" height="7" rx="2" fill="#FFFFFF" />
      <rect x="7.5" y="8" width="7" height="1.6" rx="0.8" fill="#93C5FD" />
      <circle cx="8.8" cy="11.8" r="0.7" fill="#CBD5E1" />
      <circle cx="11" cy="11.8" r="0.7" fill="#CBD5E1" />
      <circle cx="13.2" cy="11.8" r="0.7" fill="#CBD5E1" />
    </g>

    <!-- Bottom-Right Seat Card -->
    <g filter="url(#shadow-compact)">
      <rect x="16.5" y="18" width="9" height="7" rx="2" fill="#FFFFFF" />
      <rect x="17.5" y="19" width="7" height="1.6" rx="0.8" fill="#FCA5A5" />
      <circle cx="18.8" cy="22.8" r="0.7" fill="#CBD5E1" />
      <circle cx="21" cy="22.8" r="0.7" fill="#CBD5E1" />
      <circle cx="23.2" cy="22.8" r="0.7" fill="#CBD5E1" />
    </g>

    <!-- Center Sparkle -->
    <path d="M 16 14.5 Q 16 16 17.5 16 Q 16 16 16 17.5 Q 16 16 14.5 16 Q 16 16 16 14.5 Z" fill="#FEF3C7" />
  </g>

  <!-- Typography: ラクガエ -->
  <text x="44" y="25" font-family="'Zen Maru Gothic', 'Rounded Mplus 1c', 'Hiragino Maru Gothic ProN', sans-serif" font-size="20" font-weight="700" fill="#334155" letter-spacing="0.04em">ラクガエ</text>
</svg>
