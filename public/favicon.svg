<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#logo-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Upper Arc Arrow (Left -> Right) -->
  <path d="M 32 16 C 43 16 48 21 48 28" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <path d="M 44.5 25 L 48 28.5 L 51.5 25" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Lower Arc Arrow (Right -> Left) -->
  <path d="M 32 48 C 21 48 16 43 16 36" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <path d="M 19.5 39 L 16 35.5 L 12.5 39" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Top-Left Seat Card -->
  <g filter="url(#shadow)">
    <rect x="13" y="14" width="18" height="14" rx="3.5" fill="#FFFFFF" />
    <rect x="15.5" y="16.5" width="13" height="3" rx="1.5" fill="#93C5FD" />
    <circle cx="17.5" cy="23.5" r="1.5" fill="#CBD5E1" />
    <circle cx="22" cy="23.5" r="1.5" fill="#CBD5E1" />
    <circle cx="26.5" cy="23.5" r="1.5" fill="#CBD5E1" />
  </g>

  <!-- Bottom-Right Seat Card -->
  <g filter="url(#shadow)">
    <rect x="33" y="36" width="18" height="14" rx="3.5" fill="#FFFFFF" />
    <rect x="35.5" y="38.5" width="13" height="3" rx="1.5" fill="#FCA5A5" />
    <circle cx="37.5" cy="45.5" r="1.5" fill="#CBD5E1" />
    <circle cx="42" cy="45.5" r="1.5" fill="#CBD5E1" />
    <circle cx="46.5" cy="45.5" r="1.5" fill="#CBD5E1" />
  </g>

  <!-- Center Sparkle -->
  <path d="M 32 29 Q 32 32 35 32 Q 32 32 32 35 Q 32 32 29 32 Q 32 32 32 29 Z" fill="#FEF3C7" />
</svg>
